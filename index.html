<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NARDA 3D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --wood1:#d99a55;
  --wood2:#542710;
  --wood3:#9d6030;
  --wood4:#32170a;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at 50% 20%,#353535,#080808 78%);
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button{
  font:inherit;
  cursor:pointer;
}

.header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
  background:#0009;
  border-bottom:1px solid #ffffff12;
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
}

.header-buttons{
  display:flex;
  gap:7px;
}

.btn{
  border:1px solid #ffffff18;
  color:white;
  background:linear-gradient(145deg,#444,#151515);
  padding:9px 13px;
  border-radius:12px;
  font-weight:bold;
  box-shadow:0 4px 0 #050505,0 8px 15px #0008;
}

.btn:active{
  transform:translateY(3px);
}

.game{
  height:calc(100vh - 58px);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:8px;
}

.player{
  width:135px;
  min-width:135px;
  padding:12px 7px;
  text-align:center;
  border-radius:18px;
  background:#121212c7;
  border:1px solid #ffffff14;
}

.avatar{
  width:62px;
  height:62px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:29px;
  background:linear-gradient(145deg,#555,#111);
  border:4px solid #b9b9b9;
  box-shadow:0 6px 18px #000;
}

.player-name{
  margin-top:7px;
  font-weight:bold;
}

.player-user{
  color:#999;
  font-size:11px;
  margin-top:3px;
}

.rank{
  margin-top:8px;
  font-size:12px;
  color:#e6bf55;
}

.board-wrap{
  perspective:1400px;
  max-width:calc(100vw - 32px);
}

.board{
  position:relative;

  width:min(72vw,920px);
  height:min(73vh,600px);

  min-width:590px;
  min-height:370px;

  border:13px solid var(--wood4);
  border-radius:30px;

  transform:rotateX(7deg);

  background:
    linear-gradient(
      90deg,
      var(--wood2),
      var(--wood1) 8%,
      var(--wood3) 50%,
      var(--wood1) 92%,
      var(--wood2)
    );

  box-shadow:
    0 28px 0 #170b05,
    0 42px 55px #000c,
    inset 0 0 35px #0009;

  transition:.5s;
}

.board::after{
  content:"";
  position:absolute;
  left:-13px;
  right:-13px;
  bottom:-27px;
  height:27px;

  border-radius:0 0 22px 22px;

  background:
    linear-gradient(
      90deg,
      #170b05,
      var(--wood2),
      var(--wood1),
      var(--wood2),
      #170b05
    );

  z-index:-1;
}

/* AQUARIUM */

.aquarium{
  position:absolute;
  inset:12px;

  overflow:hidden;

  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      rgba(105,220,255,.28),
      rgba(0,100,150,.25)
    );

  border:2px solid #e6ffff99;

  box-shadow:
    inset 0 0 35px #fff2,
    inset 0 -30px 50px #00325066;

  opacity:0;
  pointer-events:none;

  transition:opacity .5s;

  z-index:2;
}

.board.aquarium-mode .aquarium{
  opacity:1;
}

.glass-reflection{
  position:absolute;
  width:160%;
  height:30%;
  top:-10%;
  left:-30%;

  background:
    linear-gradient(
      120deg,
      transparent,
      #fff4,
      transparent
    );

  transform:rotate(-8deg);

  animation:glassMove 8s linear infinite;
}

@keyframes glassMove{
  from{
    transform:translateX(-30%) rotate(-8deg);
  }

  to{
    transform:translateX(30%) rotate(-8deg);
  }
}

.fish{
  position:absolute;
  font-size:25px;
  filter:drop-shadow(0 3px 4px #002a);
  animation:fishMove 12s linear infinite;
}

.fish1{
  top:20%;
  left:-10%;
}

.fish2{
  top:43%;
  left:10%;
  animation-duration:15s;
  animation-delay:-4s;
}

.fish3{
  top:68%;
  left:-15%;
  animation-duration:13s;
  animation-delay:-7s;
}

.fish4{
  top:30%;
  left:45%;
  animation-duration:17s;
  animation-delay:-10s;
}

.fish5{
  top:75%;
  left:55%;
  animation-duration:14s;
  animation-delay:-3s;
}

@keyframes fishMove{

  0%{
    transform:translateX(-80px);
  }

  48%{
    transform:translateX(650px);
  }

  50%{
    transform:translateX(650px) scaleX(-1);
  }

  100%{
    transform:translateX(-80px) scaleX(-1);
  }
}

.bubble{
  position:absolute;
  width:8px;
  height:8px;
  border:1px solid #ffffff80;
  border-radius:50%;
  bottom:-20px;
  animation:bubbleUp 6s linear infinite;
}

.b1{left:20%}
.b2{left:40%;animation-delay:1.5s}
.b3{left:65%;animation-delay:3s}
.b4{left:82%;animation-delay:4s}

@keyframes bubbleUp{

  0%{
    transform:translateY(0);
    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:translateY(-450px);
    opacity:0;
  }
}

/* MAYDON */

.field{
  position:absolute;
  inset:32px;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:42px;

  z-index:4;
}

.half{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:4px;
}

.point{
  height:47%;

  background:
    linear-gradient(
      135deg,
      var(--wood1),
      var(--wood2)
    );

  clip-path:
    polygon(50% 100%,0 0,100% 0);

  opacity:.9;

  box-shadow:0 0 5px #0008;
}

.half:nth-child(2) .point{
  transform:rotate(180deg);
}

.center{
  position:absolute;

  top:18px;
  bottom:18px;
  left:50%;

  width:38px;

  transform:translateX(-50%);

  border-radius:13px;

  background:
    linear-gradient(
      90deg,
      var(--wood2),
      var(--wood1),
      var(--wood2)
    );

  box-shadow:
    inset 0 0 8px #fff4,
    0 0 18px #0009;

  z-index:6;
}

/* SHASHKALAR */

.stack{
  position:absolute;
  z-index:15;
}

.checker{
  width:42px;
  height:42px;

  border-radius:50%;

  margin-top:-7px;

  border:3px solid #ffffff55;

  box-shadow:
    0 6px 7px #000c,
    inset 0 5px 7px #fff6;
}

.white{
  background:
    radial-gradient(
      circle at 30% 25%,
      #fff,
      #b8b8b8 55%,
      #777
    );
}

  background
