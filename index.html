<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NARDA</title>

<style>
body{
  margin:0;
  background:#17100b;
  color:white;
  font-family:Arial;
  text-align:center;
}

h1{margin:15px}

#turn{
  font-size:18px;
  margin:10px;
}

.board{
  width:92%;
  max-width:650px;
  margin:auto;
  padding:10px;
  background:#8b542d;
  border:5px solid #d59b55;
  border-radius:12px;
}

.row{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:4px;
}

.point{
  height:150px;
  background:#d9a35c;
  position:relative;
}

.point:nth-child(even){
  background:#9d5e35;
}

.triangle{
  width:0;
  height:0;
  border-left:22px solid transparent;
  border-right:22px solid transparent;
  border-top:120px solid #633617;
  margin:auto;
}

/* ZARLAR DOSKA ICHIDA */
.dice-area{
  height:110px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:25px;
  background:#70401f;
  border-radius:10px;
  margin:8px 0;
}

.dice{
  font-size:55px;
  display:inline-block;
}

.rolling{
  animation:rollDice .35s linear infinite;
}

@keyframes rollDice{
  0%{transform:rotate(0deg) scale(1)}
  25%{transform:rotate(90deg) scale(1.15)}
  50%{transform:rotate(180deg) scale(1)}
  75%{transform:rotate(270deg) scale(1.15)}
  100%{transform:rotate(360deg) scale(1)}
}

button{
  padding:14px 25px;
  border:0;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  margin-top:15px;
}

#msg{
  margin:15px;
}
</style>
</head>

<body>

<h1>🎲 NARDA</h1>

<div id="turn">Navbat: Oq</div>

<div class="board">

  <div class="row">
    <div class="point"><div class="triangle"></div></div>
    <div class="point"><div class="triangle"></div></div>
    <div class="point"><div class="triangle"></div></div>
    <div class="point"><div class="triangle"></div></div>
    <div class="point"><div class="triangle"></div></div>
    <div class="point"><div class="triangle"></div></div>
  </div>

  <!-- ZARLAR -->
  <div class="dice-area">
    <div class="dice" id="dice1">⚀</div>
    <div class="dice" id="dice2">⚀</div>
  </div>

  <div class="row">
    <div class="point"><div class="triangle"></div></div>
    <div class="point"><div class="triangle"></div></div>
    <div class="point"><div class="triangle"></div></div>
    <div class="point"><div class="triangle"></div></div>
    <div class="point"><div class="triangle"></div></div>
    <div class="point"><div class="triangle"></div></div>
  </div>

</div>

<button onclick="roll()">🎲 ZAR TASHLASH</button>

<div id="msg">O‘yinni boshlang!</div>

<script>

let player="Oq";

const faces=["⚀","⚁","⚂","⚃","⚄","⚅"];

function roll(){

  const d1=document.getElementById("dice1");
  const d2=document.getElementById("dice2");

  d1.classList.add("rolling");
  d2.classList.add("rolling");

  let count=0;

  let animation=setInterval(function(){

    d1.innerText=faces[Math.floor(Math.random()*6)];
    d2.innerText=faces[Math.floor(Math.random()*6)];

    count++;

    if(count>=10){

      clearInterval(animation);

      let a=Math.floor(Math.random()*6)+1;
      let b=Math.floor(Math.random()*6)+1;

      d1.innerText=faces[a-1];
      d2.innerText=faces[b-1];

      d1.classList.remove("rolling");
      d2.classList.remove("rolling");

      document.getElementById("msg").innerText=
        player+"ga "+a+" va "+b+" tushdi!";

      player=player==="Oq"?"Qora":"Oq";

      document.getElementById("turn").innerText=
        "Navbat: "+player;
    }

  },120);
}

</script>

</body>
</html>
