<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NARDA 3D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 20%,#303030,#101010 65%);
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* HEADER */
.top{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
  background:rgba(0,0,0,.45);
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
}

button{
  border:0;
  border-radius:12px;
  padding:10px 15px;
  font-weight:bold;
  color:white;
  background:linear-gradient(145deg,#444,#181818);
  box-shadow:
    0 4px 0 #050505,
    0 7px 15px #0008;
}

button:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #050505;
}

/* MAIN */
.game{
  height:calc(100vh - 60px);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:10px;
}

/* PLAYER */
.player{
  width:145px;
  min-width:145px;
  text-align:center;
  padding:12px 7px;
  border-radius:18px;
  background:rgba(20,20,20,.7);
  border:1px solid #ffffff18;
}

.avatar{
  width:60px;
  height:60px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  background:linear-gradient(145deg,#555,#111);
  border:3px solid #d8a62a;
  box-shadow:0 5px 18px #000;
}

.name{
  margin-top:7px;
  font-weight:bold;
}

.username{
  font-size:12px;
  color:#aaa;
}

/* BOARD AREA */
.board-wrap{
  perspective:1300px;
}

  width:min(72vw,900px);
  height:min(72vh,600px);
